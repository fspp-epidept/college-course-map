version: '3'
method: checksum

includes:
  models:
    taskfile: ./scripts/models
    dir: ./scripts/models

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list-all
    silent: true

  gen:bindings:
    desc: Regenerate src/bindings.ts from the Rust IPC commands (tauri-specta), then format it
    cmds:
      # The exporter runs as a test so it works headlessly (no running webview).
      # cargo runs the test with CWD = the crate dir, so its `../src/bindings.ts`
      # export path resolves to the repo's src/ even when invoked from the root.
      - cargo test --manifest-path src-tauri/Cargo.toml export_bindings
      # specta emits unformatted TS; bring it to the repo's Biome style.
      - pnpm exec biome format --write src/bindings.ts

  dev:
    desc: Run the full Tauri app (Vite + native webview, IPC live)
    interactive: true
    # WebKitGTK's DMABUF renderer crashes the webview under Wayland on NVIDIA
    # ("Gdk Error 71 Protocol error"); disabling it falls back to a stable path.
    # No-op on macOS/Windows. See also #97.
    env:
      WEBKIT_DISABLE_DMABUF_RENDERER: 1
    cmds:
      - pnpm tauri dev

  dev:ui:
    desc: Run the Vite dev server only (browser, no IPC backend)
    interactive: true
    cmds:
      - pnpm dev

  build:
    desc: Build the Tauri app bundle
    cmds:
      - pnpm tauri build

  fmt:
    desc: Format all code (Biome + rustfmt)
    cmds:
      - task: fmt:js
      - task: fmt:rust

  fmt:check:
    desc: Check formatting without writing (Biome + rustfmt)
    cmds:
      - task: fmt:js:check
      - task: fmt:rust:check

  lint:
    desc: Lint all code (Biome + clippy)
    cmds:
      - task: lint:js
      - task: lint:rust

  check:
    desc: Full check — fmt + lint + typecheck for both stacks
    cmds:
      - task: fmt:check
      - task: lint
      - task: check:rust
      - task: check:js

  fmt:js:
    desc: Format JS/TS/Vue/JSON/CSS with Biome
    cmds:
      - pnpm exec biome format --write .

  fmt:js:check:
    desc: Check JS/TS/Vue/JSON/CSS formatting
    cmds:
      - pnpm exec biome format .

  lint:js:
    desc: Lint JS/TS/Vue with Biome
    cmds:
      - pnpm exec biome lint .

  lint:js:fix:
    desc: Lint JS/TS/Vue with Biome and apply safe fixes
    cmds:
      - pnpm exec biome lint --write .

  check:js:
    desc: Vue/TS typecheck (vue-tsc, no emit)
    cmds:
      - pnpm exec vue-tsc --noEmit

  fmt:rust:
    desc: Format Rust with rustfmt
    dir: src-tauri
    cmds:
      - cargo fmt --all

  fmt:rust:check:
    desc: Check Rust formatting (no writes)
    dir: src-tauri
    cmds:
      - cargo fmt --all -- --check

  lint:rust:
    desc: Lint Rust with clippy (warnings as errors)
    dir: src-tauri
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  lint:rust:fix:
    desc: Apply clippy auto-fixes (rerun with --allow-dirty if needed)
    dir: src-tauri
    cmds:
      - cargo clippy --fix --all-targets --all-features

  check:rust:
    desc: Fast Rust typecheck
    dir: src-tauri
    cmds:
      - cargo check --all-targets --all-features

  db:reset:
    desc: Delete the local DuckDB file (re-created with a fresh schema on next launch)
    cmds:
      - cargo run --quiet --manifest-path src-tauri/Cargo.toml --example db_reset

  seed:demo:
    desc: Truncate and reinsert fixture data so the UI has something to render in dev
    cmds:
      - cargo run --quiet --manifest-path src-tauri/Cargo.toml --example seed_demo

  check:parity:
    desc: Run Rust ONNX inference against the Python parity fixture and assert argmax/top-3 match
    cmds:
      # Release-only: debug FP behavior can flip near-tied argmaxes vs the
      # Python reference (which was captured with the same opt level as Rust
      # release). See examples/check_parity.rs.
      - cargo run --release --manifest-path src-tauri/Cargo.toml --example check_parity
