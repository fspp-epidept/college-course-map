version: '3'
method: checksum

includes:
  models:
    taskfile: ./scripts/models
    dir: ./scripts/models

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list-all
    silent: true

  gen:bindings:
    desc: Regenerate src/bindings.ts from the Rust IPC commands (tauri-specta)
    cmds:
      # The exporter runs as a test so it works headlessly (no running webview).
      # cargo runs the test with CWD = the crate dir, so its `../src/bindings.ts`
      # export path resolves to the repo's src/ even when invoked from the root.
      # The file is committed exactly as specta emits it — Biome neither lints
      # nor formats it (biome.json override) — so any later `cargo test` run
      # regenerates byte-identical output instead of dirtying the tree.
      - cargo test --manifest-path src-tauri/Cargo.toml export_bindings

  dev:
    desc: Run the full Tauri app (Vite + native webview, IPC live)
    interactive: true
    # WebKitGTK's DMABUF renderer crashes the webview under Wayland on NVIDIA
    # ("Gdk Error 71 Protocol error"); disabling it falls back to a stable path.
    # No-op on macOS/Windows. See also #97.
    env:
      WEBKIT_DISABLE_DMABUF_RENDERER: 1
    cmds:
      - pnpm tauri dev

  dev:ui:
    desc: Run the Vite dev server only (browser, no IPC backend)
    interactive: true
    cmds:
      - pnpm dev

  build:
    desc: Build the Tauri app bundle
    cmds:
      - pnpm tauri build

  build:airgap:
    desc: Build installers with models bundled from scripts/models/output (airgap flavor)
    env:
      # linuxdeploy's bundled binutils can't strip libs with `.relr.dyn`
      # sections (modern glibc/toolchain hosts, e.g. Arch); stripping is
      # cosmetic for a 1.4 GB bundle anyway.
      NO_STRIP: "1"
    preconditions:
      - sh: test -f scripts/models/output/two-digit/model.onnx
        msg: "models missing — run `task models:convert` first"
    cmds:
      - pnpm tauri build --config src-tauri/tauri.airgap.conf.json --features airgap --bundles deb,appimage

  fmt:
    desc: Format all code (Biome + rustfmt)
    cmds:
      - task: fmt:js
      - task: fmt:rust

  fmt:check:
    desc: Check formatting without writing (Biome + rustfmt)
    cmds:
      - task: fmt:js:check
      - task: fmt:rust:check

  lint:
    desc: Lint all code (Biome + clippy)
    cmds:
      - task: lint:js
      - task: lint:rust

  check:
    desc: Full check — fmt + lint + typecheck for both stacks
    cmds:
      - task: fmt:check
      - task: lint
      # No check:rust here on purpose: clippy (lint:rust) fully type-checks
      # as part of linting; a separate cargo check pass duplicates the whole
      # compile. `task check:rust` stays available for a fast standalone
      # typecheck during development.
      - task: check:js

  fmt:js:
    desc: Format JS/TS/Vue/JSON/CSS with Biome
    cmds:
      - pnpm exec biome format --write .

  fmt:js:check:
    desc: Check JS/TS/Vue/JSON/CSS formatting
    cmds:
      - pnpm exec biome format .

  lint:js:
    desc: Lint JS/TS/Vue with Biome
    cmds:
      - pnpm exec biome lint .

  lint:js:fix:
    desc: Lint JS/TS/Vue with Biome and apply safe fixes
    cmds:
      - pnpm exec biome lint --write .

  check:js:
    desc: Vue/TS typecheck (vue-tsc, no emit)
    cmds:
      - pnpm exec vue-tsc --noEmit

  fmt:rust:
    desc: Format Rust with rustfmt
    dir: src-tauri
    cmds:
      - cargo fmt --all

  fmt:rust:check:
    desc: Check Rust formatting (no writes)
    dir: src-tauri
    cmds:
      - cargo fmt --all -- --check

  lint:rust:
    desc: Lint Rust with clippy (warnings as errors)
    dir: src-tauri
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  lint:rust:fix:
    desc: Apply clippy auto-fixes (rerun with --allow-dirty if needed)
    dir: src-tauri
    cmds:
      - cargo clippy --fix --all-targets --all-features

  check:rust:
    desc: Fast Rust typecheck
    dir: src-tauri
    cmds:
      - cargo check --all-targets --all-features

  db:reset:
    desc: Delete the local DuckDB file (re-created with a fresh schema on next launch)
    cmds:
      - cargo run --quiet --manifest-path src-tauri/Cargo.toml --example db_reset

  seed:demo:
    desc: Truncate and reinsert fixture data so the UI has something to render in dev
    cmds:
      - cargo run --quiet --manifest-path src-tauri/Cargo.toml --example seed_demo

  db:clear-data:
    desc: Wipe user data (datasets / courses / runs / results) but keep the models table populated
    cmds:
      - cargo run --quiet --manifest-path src-tauri/Cargo.toml --example clear_user_data

  db:checkpoint:
    desc: Compact the DuckDB WAL into the main file (speeds up first read after a big import)
    cmds:
      - cargo run --quiet --manifest-path src-tauri/Cargo.toml --example checkpoint

  models:install:
    desc: Copy converted ONNX models from scripts/models/output into the data dir (skips entries that already exist)
    cmds:
      - cargo run --quiet --manifest-path src-tauri/Cargo.toml --example models_install

  check:parity:
    desc: Run Rust ONNX inference against the Python parity fixture and assert argmax/top-3 match
    cmds:
      # Release-only: debug FP behavior can flip near-tied argmaxes vs the
      # Python reference (which was captured with the same opt level as Rust
      # release). See examples/check_parity.rs.
      - cargo run --release --manifest-path src-tauri/Cargo.toml --example check_parity
