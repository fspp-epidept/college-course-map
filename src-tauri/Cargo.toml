[package]
name = "course-classifier"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "course_classifier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Airgap installer flavor (packaging ADR): models are bundled into the
# installer via tauri.airgap.conf.json's `bundle.resources` and loaded from
# the bundle's resource dir. Build with `task build:airgap`.
airgap = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "=0.0.9"
dirs = "6"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
duckdb = { version = "1", features = ["bundled", "serde_json"] }
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tauri-plugin-dialog = "2"
csv = "1"
# load-dynamic: nothing is linked at build time; the ONNX Runtime dylib is
# resolved from a runtime pack (runtimes.toml) and loaded via ort::init_from at
# startup. EP features only gate the Rust config API — which EPs actually exist
# is a property of the loaded pack. api-24 matches the pinned pack version
# (ONNX Runtime 1.24.x).
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "api-24",
    "load-dynamic",
    "cuda",
    "tensorrt",
    "directml",
    "coreml",
] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
ndarray = "0.17"
toml = "0.9"
# Connected-build model downloader (models.rs): blocking client driven from
# spawn_blocking; rustls so we never link system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"

# Runtime-pack extraction (runtime.rs): official ONNX Runtime release archives
# are .tgz on Linux/macOS and .zip on Windows; GPU support-library packs
# (EPI-84) are PyPI wheels — zips — on every platform.
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
flate2 = "1"
tar = "0.4"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unused_qualifications = "warn"
unreachable_pub = "warn"
nonstandard_style = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Selected restriction lints: encourage Result-based error handling and
# flag debug leftovers. Restriction is opt-in by design.
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
panic = "warn"
indexing_slicing = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Pedantic noise we don't care about:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

