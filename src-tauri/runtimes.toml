# --- macOS aarch64 ---
# The official osx build includes the CoreML EP, but the pack does not claim
# it (decision 2026-08-25, EPI-107): the NeuralNetwork-format CoreML EP fails
# at run time on ModernBERT, and `eps` is a registration precondition
# (EPI-104), so listing it would make every Mac fail by default. Re-add
# "coreml" only when the EPI-108 spike proves parity. No separate GPU pack
# and never a libs pack — CoreML is built into the OS.

[[pack]]
id = "cpu"
display_name = "CPU"
target = "aarch64-apple-darwin"
eps = ["cpu"]
layout = "onnxruntime"

[[pack.archives]]
url = "https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-osx-arm64-1.24.2.tgz"
sha256 = "0af4fa503e8ea285245b47ee42d0a7461b8156a81270857da0c1d4ecf858abde"
size = 31604221
