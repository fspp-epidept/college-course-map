# Pinned ONNX Runtime packs (EPI-73) and GPU support-library packs (EPI-84) —
# what `load-dynamic` loads at startup. Runtime packs are repackaged official
# microsoft/onnxruntime release assets; libs packs are the redistributable
# NVIDIA wheels from PyPI (content-addressed URLs, digests from the PyPI JSON
# API). Everything is pinned by exact version + sha256. `ort_version` must
# stay in lockstep with the ONNX Runtime version the `ort` crate targets (see
# Cargo.toml: ort 2.0.0-rc.12 = api-24 = ONNX Runtime 1.24.x) — bumping `ort`
# means re-pinning every pack in the same PR.
#
# `id` is the user-facing pack name; (id, target) is the lookup key.
# `layout` controls extraction: "onnxruntime" strips the archive's single
# top-level directory; "flat-dylibs" extracts only dynamic libraries,
# flattened into `lib/` (the wheel layout nests them per component).
# `eps` lists execution providers a runtime pack carries (display metadata);
# `libs` names the companion libs pack that satisfies those EPs' system
# dependencies when no system-wide install exists.

ort_version = "1.24.2"

# --- Linux x86_64 ---

[[pack]]
id = "cpu"
display_name = "CPU"
target = "x86_64-unknown-linux-gnu"
eps = ["cpu"]
layout = "onnxruntime"

[[pack.archives]]
url = "https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-linux-x64-1.24.2.tgz"
sha256 = "43725474ba5663642e17684717946693850e2005efbd724ac72da278fead25e6"
size = 8123282

[[pack]]
id = "cuda"
display_name = "CUDA 12 + TensorRT"
target = "x86_64-unknown-linux-gnu"
eps = ["cuda", "tensorrt"]
layout = "onnxruntime"
# No cu12 libs pack is pinned yet — cu12 users are assumed to have a system
# install. Add one on demand (same wheel idiom, cu12 package names).

[[pack.archives]]
url = "https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-linux-x64-gpu-1.24.2.tgz"
sha256 = "bcb42da041f42192e5579de175f7410313c114740a611e230afe9d79be65cc49"
size = 205369881

[[pack]]
id = "cuda13"
display_name = "CUDA 13 + TensorRT"
target = "x86_64-unknown-linux-gnu"
eps = ["cuda", "tensorrt"]
layout = "onnxruntime"
libs = "cuda13-libs"

[[pack.archives]]
url = "https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-linux-x64-gpu_cuda13-1.24.2.tgz"
sha256 = "75128942ac9b22fb5001f1e1e041b473793958db016cd124a2ad981fe273ae12"
size = 180220519

# CUDA 13 support libraries (EPI-84): the exact redistributable NVIDIA wheels
# verified working on 2026-07-03 (via the models venv). cuDNN's engine libs
# dominate the size and are dlopened lazily — do not strip them. The NVIDIA
# driver itself is the one system prerequisite that cannot be shipped.

[[pack]]
id = "cuda13-libs"
display_name = "CUDA 13 support libraries"
target = "x86_64-unknown-linux-gnu"
eps = []
layout = "flat-dylibs"

