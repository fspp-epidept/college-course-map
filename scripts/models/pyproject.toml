[project]
name = "course-classifier-models"
version = "0.1.0"
description = "Convert annamp HF models to ONNX, verify parity, validate on labeled data, publish."
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.45",
    "torch>=2.4",
    "optimum>=2.0",
    "optimum-onnx>=0.1",
    "onnx>=1.17",
    "onnxruntime-gpu>=1.20",
    "numpy>=1.26",
    "pandas>=2.2",
    "huggingface_hub>=0.26",
    "accelerate>=0.30",
]

[tool.uv]
package = false
