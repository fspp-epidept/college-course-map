version: '3'
method: checksum

vars:
  # Discover the venv's site-packages dir at task time — survives Python
  # version changes (3.14 today, could be 3.15 tomorrow). Empty if .venv
  # doesn't exist yet, which is fine: setup will create it.
  NVIDIA_LIB_ROOT:
    sh: ls -d {{.TASKFILE_DIR}}/.venv/lib/python*/site-packages/nvidia 2>/dev/null || true

env:
  PYTHONUNBUFFERED: "1"
  # ONNX Runtime's CUDA EP does a lazy dlopen at session creation that doesn't
  # search the venv's nvidia-* package dirs. Putting them on LD_LIBRARY_PATH
  # before Python starts gives the dynamic linker the path it needs.
  # cu13 must come before cudnn (cuDNN depends on cuBLAS).
  LD_LIBRARY_PATH: '{{.NVIDIA_LIB_ROOT}}/cu13/lib:{{.NVIDIA_LIB_ROOT}}/cudnn/lib:{{.LD_LIBRARY_PATH | default ""}}'

tasks:
  setup:
    desc: Install Python deps via uv
    cmds: [uv sync]
    sources:
      - pyproject.toml
      - uv.lock
    generates:
      - .venv/pyvenv.cfg

  convert:
    desc: Export annamp PyTorch models to ONNX (idempotent)
    deps: [setup]
    cmds: [uv run python convert.py]
    sources:
      - convert.py
      - _lib/**/*.py
    generates:
      - output/two-digit/model.onnx
      - output/four-digit/model.onnx
      - output/six-digit/model.onnx
      - output/format_spec.json

  verify:
    desc: Parity check — ONNX vs PyTorch on synthetic corpus
    deps: [convert]
    cmds: [uv run python verify.py]
    sources:
      - verify.py
      - _lib/**/*.py
      - data/parity_inputs.csv
      - output/two-digit/model.onnx
      - output/four-digit/model.onnx
      - output/six-digit/model.onnx

  validate:
    desc: 'Validate against panel data (default: 10k sample)'
    deps: [verify]
    cmds:
      - 'uv run python validate.py --size={{.SIZE | default "10k"}} {{.CLI_ARGS}}'

  validate:full:
    desc: Full-panel validation (slow)
    deps: [verify]
    cmds: [uv run python validate.py --size=full]

  all:
    desc: Convert + verify (no validation, no upload)
    cmds:
      - task: convert
      - task: verify

  clean:
    desc: Wipe all generated artifacts (output/)
    cmds: [rm -rf output]
