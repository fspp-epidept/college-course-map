name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # RELEASE_PLEASE_TOKEN is a fine-grained PAT (Contents + Pull requests
      # RW on this repo), NOT the workflow GITHUB_TOKEN — deliberately, for
      # two reasons: the org policy blocks GITHUB_TOKEN from creating PRs,
      # and PRs created by GITHUB_TOKEN would never trigger the pr-title/CI
      # workflows (GitHub's recursion guard), leaving the release PR unable
      # to satisfy required status checks. On token expiry this job fails
      # with a 401 until a fresh PAT is stored:
      #   gh secret set RELEASE_PLEASE_TOKEN --repo fspp-epidept/college-course-map
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Installer builds (Linux/macOS/Windows, unsigned, models fetched from the
  # published robotastronaut HF repos) attach to the release created above —
  # tracked as the EPI-24/EPI-31 build-matrix follow-up. Until that lands, a
  # published release carries source archives only.
