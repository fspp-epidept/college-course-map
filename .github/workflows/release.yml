name: Release

on:
  push:
    branches: [main]
  # Retry path for the installer matrix: "Re-run failed jobs" replays the
  # workflow as it existed at the release commit, so a workflow fix can never
  # reach an already-created release that way. Dispatching with the release's
  # tag builds with the CURRENT workflow and attaches to that release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build installers for"
        required: true
        type: string
      platforms:
        description: 'JSON array of runner labels to rebuild — trim to the failed leg(s) so a Windows retry does not re-bill the 10x macOS leg'
        required: false
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-2022"]'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # RELEASE_PLEASE_TOKEN is a fine-grained PAT (Contents + Pull requests
      # RW on this repo), NOT the workflow GITHUB_TOKEN — deliberately, for
      # two reasons: the org policy blocks GITHUB_TOKEN from creating PRs,
      # and PRs created by GITHUB_TOKEN would never trigger the pr-title/CI
      # workflows (GitHub's recursion guard), leaving the release PR unable
      # to satisfy required status checks. On token expiry this job fails
      # with a 401 until a fresh PAT is stored:
      #   gh secret set RELEASE_PLEASE_TOKEN --repo fspp-epidept/college-course-map
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Installer builds attach to the release created above. Connected flavor
  # only: it ships no models (first-run in-app download), so installers are
  # small and fit GitHub's 2 GiB/asset cap. The airgap flavor
  # (--config src-tauri/tauri.airgap.conf.json --features airgap) bundles
  # ~1.8-2.2 GB of models and is blocked on EPI-62 (non-GitHub hosting);
  # its legs would also need a model-fetch pre-step reading src-tauri/
  # models.toml (same URL scheme + sha256 verify as models.rs::download_one).
  #
  # Unsigned for now. Signing lands as env vars on the tauri-action step,
  # no restructuring: TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) for the updater
  # (EPI-55), APPLE_CERTIFICATE/APPLE_ID etc. for macOS (EPI-1/21/22).
  #
  # macOS runners bill 10x minutes on this repo — this matrix runs on
  # release events only, never per-PR.
  build:
    name: Installers (${{ matrix.platform }})
    needs: release-please
    # !cancelled(): on dispatch the release-please job is skipped, which
    # would otherwise skip dependents too.
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write # upload assets to the existing release
    strategy:
      fail-fast: false
      matrix:
        # windows-2022, NOT windows-latest: the -latest image now carries the
        # VS 18 toolset, whose STL removed stdext::checked_array_iterator —
        # still used by the fmt vendored in libduckdb-sys' bundled DuckDB, so
        # the native build fails (EPI-72, v0.2.0 run). Unpin when duckdb-rs
        # bundles a DuckDB that compiles under VS 18.
        platform: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.platforms) || fromJSON('["ubuntu-latest", "macos-latest", "windows-2022"]') }}
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # On push the tag was created on this workflow's own trigger commit, so
      # the default checkout ref IS the released commit; on dispatch we must
      # check out the tag itself (main may have moved past it).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      # Reclaim ~30 GB of preinstalled toolchains before the release-profile
      # compile + deb/rpm/AppImage staging (same guard as ci.yml, where the
      # first cold run exhausted the disk).
      - name: Free runner disk space
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Canonical Tauri build list — note patchelf/xdg-utils, which the
      # lint-only list in ci.yml doesn't need.
      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      # rust-toolchain.toml pins the toolchain; the rustup shim installs it
      # on first cargo invocation.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      # beforeBuildCommand runs vue-tsc before vite build, but the
      # auto-imports.d.ts/components.d.ts it needs are gitignored Vite
      # build products — generate them first (same step as ci.yml).
      - name: Generate auto-import declarations
        run: pnpm exec vite build

      # EPI-73: `load-dynamic` links no ONNX Runtime — every bundle ships the
      # CPU runtime pack under bundle.resources (src-tauri/runtimes/cpu),
      # fetched + sha256-verified from the pinned runtimes.toml manifest.
      # Without it the bundler fails on the missing resource directory.
      - name: Fetch ONNX Runtime CPU pack
        run: cargo run --quiet --manifest-path src-tauri/Cargo.toml --example runtime_install -- cpu

      # release-please owns tag/release creation; tagName points tauri-action
      # at that existing release (gated on release_created, so it exists and
      # is non-draft, matching releaseDraft's default) — it must never create
      # its own. release-please-action exposes no release-id output, hence
      # tagName rather than releaseId.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
