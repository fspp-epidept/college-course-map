name: Release

on:
  push:
    branches: [main]
  # Retry path for the installer matrix: "Re-run failed jobs" replays the
  # workflow as it existed at the release commit, so a workflow fix can never
  # reach an already-created release that way. Dispatching with the release's
  # tag builds with the CURRENT workflow and attaches to that release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build installers for"
        required: true
        type: string
      platforms:
        description: 'JSON array of runner labels to rebuild — trim to the failed leg(s) so a Windows retry does not re-bill the 10x macOS leg'
        required: false
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-2022"]'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # RELEASE_PLEASE_TOKEN is a fine-grained PAT (Contents + Pull requests
      # RW on this repo), NOT the workflow GITHUB_TOKEN — deliberately, for
      # two reasons: the org policy blocks GITHUB_TOKEN from creating PRs,
      # and PRs created by GITHUB_TOKEN would never trigger the pr-title/CI
      # workflows (GitHub's recursion guard), leaving the release PR unable
      # to satisfy required status checks. On token expiry this job fails
      # with a 401 until a fresh PAT is stored:
      #   gh secret set RELEASE_PLEASE_TOKEN --repo fspp-epidept/college-course-map
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Installer builds attach to the release created above. Connected flavor
  # only: it ships no models (first-run in-app download), so installers are
  # small and fit GitHub's 2 GiB/asset cap. The airgap flavor
  # (--config src-tauri/tauri.airgap.conf.json --features airgap) bundles
  # ~1.8-2.2 GB of models and is blocked on EPI-62 (non-GitHub hosting);
  # its legs would also need a model-fetch pre-step reading src-tauri/
  # models.toml (same URL scheme + sha256 verify as models.rs::download_one).
  #
  # macOS is Developer ID signed + notarized; Windows and Linux are unsigned
  # for now. The Apple credentials are secrets of the `release` environment,
  # which only the macOS leg enters, so the other legs never see them.
  # Actions are pinned by commit SHA because the macOS leg runs them with
  # those secrets in scope.
  #
  # macOS runners bill 10x minutes on this repo — this matrix runs on
  # release events only, never per-PR.
  build:
    name: Installers (${{ matrix.platform }})
    needs: release-please
    # !cancelled(): on dispatch the release-please job is skipped, which
    # would otherwise skip dependents too.
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write # upload assets to the existing release
    strategy:
      fail-fast: false
      matrix:
        # windows-2022, NOT windows-latest: the -latest image now carries the
        # VS 18 toolset, whose STL removed stdext::checked_array_iterator —
        # still used by the fmt vendored in libduckdb-sys' bundled DuckDB, so
        # the native build fails (EPI-72, v0.2.0 run). Unpin when duckdb-rs
        # bundles a DuckDB that compiles under VS 18.
        platform: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.platforms) || fromJSON('["ubuntu-latest", "macos-latest", "windows-2022"]') }}
    runs-on: ${{ matrix.platform }}
    environment: ${{ matrix.platform == 'macos-latest' && 'release' || '' }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # The `release` environment gates on the workflow's ref, but a dispatch
      # builds whatever commit `inputs.tag` names — and anyone with write
      # access can push a tag. Resolve the tag to a commit SHA once, refuse
      # it unless that commit is on main (which is PR-only), and check out
      # that exact SHA, so unreviewed code never runs with the signing
      # secrets and a tag moved mid-run can't swap the commit.
      - name: Resolve dispatched tag to a commit on main
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$RELEASE_TAG" --jq .sha)"
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq .status)"
          if [[ "$status" != "behind" && "$status" != "identical" ]]; then
            echo "::error::$RELEASE_TAG ($sha) is not on main (compare status: $status)"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # On push the tag was created on this workflow's own trigger commit, so
      # the default checkout ref IS the released commit; on dispatch we check
      # out the tag's verified commit (main may have moved past it).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.dispatch.outputs.sha }}

      # Reclaim ~30 GB of preinstalled toolchains before the release-profile
      # compile + deb/rpm/AppImage staging (same guard as ci.yml, where the
      # first cold run exhausted the disk).
      - name: Free runner disk space
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # Canonical Tauri build list — note patchelf/xdg-utils, which the
      # lint-only list in ci.yml doesn't need.
      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      # rust-toolchain.toml pins the toolchain; the rustup shim installs it
      # on first cargo invocation.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      # beforeBuildCommand runs vue-tsc before vite build, but the
      # auto-imports.d.ts/components.d.ts it needs are gitignored Vite
      # build products — generate them first (same step as ci.yml).
      - name: Generate auto-import declarations
        run: pnpm exec vite build

      # `load-dynamic` links no ONNX Runtime — every bundle ships the
      # CPU runtime pack under bundle.resources (src-tauri/runtimes/cpu),
      # fetched + sha256-verified from the pinned runtimes.toml manifest.
      # Without it the bundler fails on the missing resource directory.
      # The mkdir must precede ANY cargo invocation: tauri-build's build
      # script refuses to compile while the resource path is absent, so the
      # fetch example itself can't build without it (same guard as ci.yml
      # and the runtimes:fetch task). bash shell so mkdir -p works on the
      # Windows leg too.
      - name: Fetch ONNX Runtime CPU pack
        shell: bash
        run: |
          mkdir -p src-tauri/runtimes/cpu
          cargo run --quiet --manifest-path src-tauri/Cargo.toml --example runtime_install -- cpu

      # Tauri's bundler signs the main binary and the app, but not Mach-O
      # files under Resources/ — and notarization rejects any Mach-O that
      # lacks a Developer ID signature with a secure timestamp. Sign the
      # runtime pack's dylibs in place; the signature is embedded in each
      # file, so it survives the bundler's resource copy. The API key is
      # written out here because Tauri takes it as a path.
      - name: Sign ONNX Runtime pack, stage notarization key (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/ort-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          find src-tauri/runtimes/cpu -type f -name '*.dylib' -not -path '*.dSYM/*' -print0 \
            | xargs -0 codesign --force --timestamp --options runtime \
              --sign "$APPLE_SIGNING_IDENTITY"
          security delete-keychain "$keychain"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # release-please owns tag/release creation; tagName points tauri-action
      # at that existing release (gated on release_created, so it exists and
      # is non-draft, matching releaseDraft's default) — it must never create
      # its own. release-please-action exposes no release-id output, hence
      # tagName rather than releaseId.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty outside the macOS leg (no `release` environment there).
          # APPLE_API_KEY_PATH comes from the signing step via GITHUB_ENV.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
