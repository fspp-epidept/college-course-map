name: CI

on:
  pull_request:
  # Also run on main: caches saved during pull_request runs are scoped to
  # that PR's merge ref and invisible to sibling PRs, so without a main run
  # every new PR would compile cold. The post-merge run both seeds the
  # shared default-branch cache (readable by all PRs) and gives main its
  # own green/red signal.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JS checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm install --frozen-lockfile

      # auto-imports.d.ts / components.d.ts are generated by the Vite plugins
      # and gitignored; vue-tsc needs them to exist.
      - name: Generate auto-import declarations
        run: pnpm exec vite build

      - run: task fmt:js:check
      - run: task lint:js
      - run: task check:js

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    env:
      # Debuginfo is the bulk of debug artifacts for this dependency tree
      # (tauri + duckdb + ort + arrow). The first main run filled the
      # runner's disk and killed the linker (SIGBUS); CI never uses the
      # debug symbols, so drop them.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      # Ubuntu runners ship ~30 GB of preinstalled toolchains this job never
      # touches; reclaiming the space keeps the target dir + cache from
      # exhausting the disk (which failed the first main run).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # WebKitGTK + friends: required to compile the Tauri crate on Linux.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # rust-toolchain.toml pins the toolchain; the rustup shim installs it on
      # first cargo invocation.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: task fmt:rust:check

      # Clippy fully type-checks while linting — there is deliberately no
      # separate cargo-check step (it would recompile everything).
      - run: task lint:rust

      # Same feature set as lint:rust so dependency artifacts are shared: a
      # mismatched feature set changes fingerprints and recompiles the whole
      # tree (including duckdb's ~20-minute C++ build) a second time.
      - name: Unit tests
        run: cargo test --all-features --manifest-path src-tauri/Cargo.toml
