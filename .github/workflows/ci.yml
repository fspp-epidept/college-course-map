name: CI

on:
  pull_request:
  # Also run on main: caches saved during pull_request runs are scoped to
  # that PR's merge ref and invisible to sibling PRs, so without a main run
  # every new PR would compile cold. The post-merge run both seeds the
  # shared default-branch cache (readable by all PRs) and gives main its
  # own green/red signal.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: task check + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK + friends: required to compile the Tauri crate on Linux.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # rust-toolchain.toml pins the toolchain; the rustup shim installs it on
      # first cargo invocation.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # auto-imports.d.ts / components.d.ts are generated by the Vite plugins
      # and gitignored; vue-tsc (inside `task check`) needs them to exist.
      - name: Generate auto-import declarations
        run: pnpm exec vite build

      - run: task check

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
